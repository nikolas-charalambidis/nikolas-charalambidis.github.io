<div class="links scroll">
        {% assign nav_pages = site.pages | where_exp: "p", "p.nav_title" %}
        {% assign nav_external = site.data.navigation | where: "published", true %}
        {% assign nav_items = nav_pages | concat: nav_external | sort: "nav_order" %}
        {% for item in nav_items %}
        <a href="{{site.baseurl}}{{item.url}}">{{item.nav_title}}</a>
        {% endfor %}
</div>
